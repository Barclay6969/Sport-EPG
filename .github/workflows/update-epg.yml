name: EPG aktualisieren
on:
  schedule:
    - cron: '17 6,8,10,14,18,22 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      force:
        description: Auch eine bereits aktuelle Ausgabe neu erstellen
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - merge_epg.py
      - automation.py
      - sources.json
      - tests/**
      - .github/workflows/update-epg.yml
permissions:
  contents: write
concurrency:
  group: sport-epg-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Faelligkeit und letzte vollstaendige Veroeffentlichung pruefen
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_UPDATE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            python automation.py check --force
          else
            python automation.py check
          fi
      - name: Quellen laden und XMLTV pruefen
        if: steps.cadence.outputs.run == 'true'
        run: python merge_epg.py
      - name: Veroeffentlichen, pruefen und bei Uploadfehlern wiederherstellen
        if: steps.cadence.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation.py publish
      - name: Erfolgreiche Ausgabe protokollieren
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp dist/status.json last-success.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-success.json
          if ! git diff --cached --quiet; then
            git commit -m 'EPG erfolgreich aktualisiert [skip ci]'
            git push origin HEAD:main
          fi
          echo 'EPG erfolgreich veroeffentlicht und per Pruefsumme kontrolliert.' >> "$GITHUB_STEP_SUMMARY"
          cat dist/status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Bereits aktuell
        if: steps.cadence.outputs.run != 'true'
        run: echo 'Kein neuer Download erforderlich; letzte faellige Ausgabe ist vollstaendig vorhanden.' >> "$GITHUB_STEP_SUMMARY"
